<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БЭМ JSON в HTML</title><link rel="stylesheet" href="interface.css"></head><body><header class="top"><div class="wrap"><h1>БЭМ JSON → HTML</h1></div></header><main class="wrap"><p>Структура из задания 11 преобразуется в полный HTML-документ, включая метаданные, навигацию и карточки товаров.</p><button id="parse">Создать HTML</button> <a href="generated.html">Открыть готовую страницу</a><div class="row"><section><h2><label for="input">БЭМ JSON</label></h2><textarea id="input"></textarea></section><section><h2><label for="output">HTML</label></h2><textarea id="output" readonly></textarea></section></div><p id="status" class="status" role="status">Загрузка структуры…</p></main><script src="bem-parser.js"></script><script>fetch('bem-structure.json').then(r=>r.text()).then(s=>{document.getElementById('input').value=s;document.getElementById('status').textContent='Структура загружена';});document.getElementById('parse').onclick=()=>{try{document.getElementById('output').value=renderBEM(JSON.parse(document.getElementById('input').value));document.getElementById('status').textContent='HTML сформирован';}catch(e){document.getElementById('status').textContent=e.message;}};</script></body></html>
